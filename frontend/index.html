<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Clínica</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="pagina-login">

  <main class="login-container">
    <header class="login-header">
      <h1>Sistema de Reservas</h1>
      <p class="login-subtitle">Clínica Médica</p>
    </header>

    <!-- Pestañas para elegir entre iniciar sesión y registrarse -->
    <nav class="tabs" role="tablist">
      <button class="tab tab-activa" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login">
        Iniciar sesión
      </button>
      <button class="tab" id="tab-register" role="tab" aria-selected="false" aria-controls="form-register">
        Registrarme
      </button>
    </nav>

    <!-- Formulario de login -->
    <section id="form-login" class="form-section" role="tabpanel" aria-labelledby="tab-login">
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" name="email" autocomplete="email" required placeholder="tu@correo.com">
          <p class="form-help">Usá el correo con el que te registraste.</p>
          <p class="form-error" id="login-email-error" hidden></p>
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
          <p class="form-error" id="login-password-error" hidden></p>
        </div>

        <p class="form-error form-error-global" id="login-error" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit">
          Iniciar sesión
        </button>
      </form>
    </section>

    <!-- Formulario de registro (oculto por defecto) -->
    <section id="form-register" class="form-section" role="tabpanel" aria-labelledby="tab-register" hidden>
      <form id="register-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="reg-first-name">Nombre</label>
            <input type="text" id="reg-first-name" name="first_name" required placeholder="Juan">
            <p class="form-error" id="reg-first-name-error" hidden></p>
          </div>
          <div class="form-group">
            <label for="reg-last-name">Apellido</label>
            <input type="text" id="reg-last-name" name="last_name" required placeholder="Pérez">
            <p class="form-error" id="reg-last-name-error" hidden></p>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-dni">DNI</label>
            <input type="text" id="reg-dni" name="dni" required placeholder="30123456">
            <p class="form-error" id="reg-dni-error" hidden></p>
          </div>
          <div class="form-group">
            <label for="reg-birth-date">Fecha de nacimiento</label>
            <input type="date" id="reg-birth-date" name="birth_date" required>
            <p class="form-error" id="reg-birth-date-error" hidden></p>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-phone">Teléfono</label>
            <input type="tel" id="reg-phone" name="phone" required placeholder="1145678901">
            <p class="form-error" id="reg-phone-error" hidden></p>
          </div>
          <div class="form-group">
            <label for="reg-obra-social">Obra social <span class="form-optional">(opcional)</span></label>
            <input type="text" id="reg-obra-social" name="obra_social" placeholder="OSDE, Swiss Medical...">
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Correo electrónico</label>
          <input type="email" id="reg-email" name="email" autocomplete="email" required placeholder="tu@correo.com">
          <p class="form-help">Lo vas a usar para iniciar sesión.</p>
          <p class="form-error" id="reg-email-error" hidden></p>
        </div>

        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" name="password" autocomplete="new-password" required minlength="6">
          <p class="form-help">Mínimo 6 caracteres.</p>
          <p class="form-error" id="reg-password-error" hidden></p>
        </div>

        <p class="form-error form-error-global" id="register-error" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" id="register-submit">
          Crear mi cuenta
        </button>
      </form>
    </section>
  </main>

  <!-- Cargar los scripts al final para que el HTML esté listo -->
  <script src="js/config.js?v=4"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
