<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Clínica</title>
  <link rel="stylesheet" href="estilos.css?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="pagina-login">

  <main class="login-container">
    <header class="login-header">
      <h1>Recuperar contraseña</h1>
      <p class="login-subtitle">Clínica Médica</p>
    </header>

    <!-- Paso 1: pedir el enlace por correo (cuando no hay token en la URL) -->
    <section id="seccion-pedir" class="form-section" hidden>
      <form id="form-pedir" novalidate>
        <p class="form-help">Escribí el correo de tu cuenta y te mandamos un enlace para crear una contraseña nueva.</p>
        <div class="form-group">
          <label for="forgot-email">Correo electrónico</label>
          <input type="email" id="forgot-email" autocomplete="email" required placeholder="tu@correo.com">
          <p class="form-error" id="forgot-email-error" hidden></p>
        </div>
        <p class="form-error form-error-global" id="forgot-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="forgot-submit">Enviarme el enlace</button>
      </form>
    </section>

    <!-- Paso 2: elegir la contraseña nueva (cuando llega con ?token=...) -->
    <section id="seccion-cambiar" class="form-section" hidden>
      <form id="form-cambiar" novalidate>
        <div class="form-group">
          <label for="reset-password">Contraseña nueva</label>
          <input type="password" id="reset-password" autocomplete="new-password" required minlength="8">
          <p class="form-help">Mínimo 8 caracteres.</p>
          <p class="form-error" id="reset-password-error" hidden></p>
        </div>
        <div class="form-group">
          <label for="reset-password-confirm">Repetí la contraseña</label>
          <input type="password" id="reset-password-confirm" autocomplete="new-password" required minlength="8">
          <p class="form-error" id="reset-password-confirm-error" hidden></p>
        </div>
        <p class="form-error form-error-global" id="reset-error" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Guardar contraseña nueva</button>
      </form>
    </section>

    <!-- Mensaje final (exito) -->
    <section id="seccion-mensaje" class="form-section" hidden>
      <p class="mensaje-ok" id="mensaje-texto" role="status"></p>
    </section>

    <p class="login-link-secundario"><a href="index.html">← Volver a iniciar sesión</a></p>
  </main>

  <script src="js/config.js?v=9"></script>
  <script src="js/reset-password.js?v=1"></script>
</body>
</html>
