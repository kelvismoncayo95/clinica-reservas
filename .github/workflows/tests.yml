name: Tests

on:
  push:
    branches: [ "main", "rediseno" ]
  pull_request:
    branches: [ "main", "rediseno" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinica_test
        SECRET_KEY: test_secret_key_para_github_actions
        CLINIC_TIMEZONE: America/Montevideo
        TESTING: "true"
      run: |
        cd backend
        # Activamos btree_gist para que las migraciones corran
        PGPASSWORD=postgres psql -h localhost -U postgres -d clinica_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
        pytest -q
