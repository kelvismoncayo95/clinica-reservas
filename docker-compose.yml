version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinica_reservas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/clinica_reservas
      - SECRET_KEY=clave_secreta_para_desarrollo
      - CLINIC_TIMEZONE=America/Montevideo
      - CORS_ORIGINS=http://localhost:5500,http://127.0.0.1:5500
    depends_on:
      - db
volumes:
  postgres_data:
